name: TradePilot scaffold checks

on:
  pull_request:
    branches: [main]
    paths:
      - "App.tsx"
      - "app.json"
      - "package.json"
      - "tsconfig.json"
      - "src/**"
      - "tests/**"
      - ".github/workflows/tradepilot-checks.yml"
  push:
    branches: [feature/tradepilot-ios-scaffold]
    paths:
      - "App.tsx"
      - "app.json"
      - "package.json"
      - "tsconfig.json"
      - ".github/workflows/tradepilot-checks.yml"

jobs:
  typecheck:
    name: Expo and TypeScript validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run validation tests
        run: npm test

      - name: Check Expo configuration and dependencies
        run: npx expo-doctor
