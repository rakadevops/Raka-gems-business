name: Validate Raka Gems media sync
on:
  push:
    branches:
      - feature/raka-media-sync
    paths:
      - 'scripts/raka_media_sync.py'
      - '.github/workflows/validate-media-sync.yml'
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile the sync script
        run: python -m py_compile scripts/raka_media_sync.py
